[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-attributes-detector"
version = "2.0.0"
description = "Human detection, tracking, and visual attribute classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "click>=8.1,<9",
    "numpy>=1.26,<3",
    "pillow>=10.4,<13",
    "scipy==1.17.1"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.32,<1",
    "uvicorn[standard]>=0.30,<1",
]
cpu = [
    "opencv-python-headless>=4.10,<5",
    "onnxruntime>=1.28,<2",
    "torch==2.8.0",
    "torchvision==0.23.0",
]
gpu = [
    "opencv-python-headless>=4.10,<5",
    "onnxruntime-gpu==1.26.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
]
minicpm = [
    "accelerate==1.2.1",
    "huggingface-hub==0.36.2",
    "librosa==0.10.2.post1",
    "safetensors==0.6.2",
    "sentencepiece==0.2.0",
    "soundfile==0.12.1",
    "timm==0.9.10",
    "torchaudio==2.8.0",
    "transformers==4.44.2",
    "vector-quantize-pytorch==1.18.5",
    "vocos==0.1.0",
]
# The special AutoGPTQ fork is built separately after PyTorch is installed;
# see scripts/setup_minicpm_int4_windows.ps1.
minicpm-int4 = [
    "accelerate==1.2.1",
    "datasets==5.0.1",
    "fsspec[http]==2026.6.0",
    "gekko==1.3.0",
    "huggingface-hub==0.36.2",
    "librosa==0.10.2.post1",
    "peft==0.13.2",
    "rouge==1.0.1",
    "safetensors==0.6.2",
    "sentencepiece==0.2.0",
    "soundfile==0.12.1",
    "threadpoolctl==3.6.0",
    "timm==0.9.10",
    "torchaudio==2.8.0",
    "tqdm==4.67.1",
    "transformers==4.44.2",
    "vector-quantize-pytorch==1.18.5",
    "vocos==0.1.0",
]
bot = [
    "httpx>=0.28,<1",
    "python-telegram-bot>=22.8,<23",
]
dev = [
    "pre-commit>=4,<5",
    "black==25.1.0",
    "isort==6.0.1",
    "flake8==7.2.0",
    "ruff>=0.9,<1",
]
train = [
    "hydra-core==1.3.2",
    "torchmetrics>=1.6,<2",
    "lightning>=2.5,<3",
    "dvc>=3.60,<4",
    "mlflow>=3.1,<4",
    "matplotlib>=3.9,<4",
]
export = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
vision = [
    "transformers==4.44.2",
    "huggingface-hub==0.36.2",
    "safetensors>=0.6,<1",
]

[project.scripts]
had = "silhouette_detector.commands:main"
had-api = "silhouette_detector.app:main"
had-bot = "silhouette_detector.bot:main"
had-download-minicpm = "silhouette_detector.model_store:main"
had-extract-embeddings = "silhouette_detector.training.extract_embeddings:main"
had-train-transformer = "silhouette_detector.training.train_transformer:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["silhouette_detector*", "SFSORT"]

[tool.setuptools.package-data]
SFSORT = ["LICENSE"]

[tool.black]
line-length = 100
extend-exclude = "/SFSORT/"

[tool.isort]
profile = "black"
line_length = 100
skip = ["SFSORT", ".venv", ".venv-clean"]

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "gpu"}], [{extra = "export"}, {extra = "gpu"}]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cuda", extra = "gpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cuda", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["SFSORT"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"tests/test_system.py" = ["S101", "S310", "S603"]
"src/silhouette_detector/app.py" = ["B008", "S104"]
"src/silhouette_detector/market_data.py" = ["S310", "S311", "S603"]
"src/silhouette_detector/market_training.py" = ["S607"]
"src/silhouette_detector/production.py" = ["S603"]
"scripts/check_project.py" = ["S603"]
"scripts/request_prediction.py" = ["S310"]
"scripts/request_triton.py" = ["S310"]
"scripts/train_minicpm_vision.py" = ["S603"]
"src/silhouette_detector/vision_store.py" = ["S310"]
