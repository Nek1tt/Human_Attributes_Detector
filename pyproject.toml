[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-attributes-detector"
version = "2.0.0"
description = "Human detection, tracking, and visual attribute classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10.4,<13",
    "scipy==1.17.1"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.32,<1",
    "uvicorn[standard]>=0.30,<1",
]
cpu = [
    "opencv-python-headless>=4.10,<5",
    "onnxruntime>=1.28,<2",
    "torch==2.8.0",
    "torchvision==0.23.0",
]
gpu = [
    "opencv-python-headless>=4.10,<5",
    "onnxruntime-gpu>=1.28,<2",
    "torch==2.8.0",
    "torchvision==0.23.0",
]
minicpm = [
    "accelerate==1.10.1",
    "huggingface-hub==0.36.2",
    "safetensors==0.6.2",
    "sentencepiece==0.2.1",
    "soundfile==0.13.1",
    "transformers==4.44.2",
]
# The special AutoGPTQ fork is built separately after PyTorch is installed;
# see scripts/setup_minicpm_int4_windows.ps1.
minicpm-int4 = [
    "accelerate==1.10.1",
    "datasets==5.0.1",
    "fsspec[http]==2026.6.0",
    "gekko==1.3.0",
    "huggingface-hub==0.36.2",
    "peft==0.13.2",
    "rouge==1.0.1",
    "safetensors==0.6.2",
    "sentencepiece==0.2.1",
    "soundfile==0.13.1",
    "threadpoolctl==3.6.0",
    "tqdm==4.67.1",
    "transformers==4.44.2",
]
bot = [
    "httpx>=0.28,<1",
    "python-telegram-bot>=22.8,<23",
]
dev = [
    "pip-audit>=2.7,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
had-api = "silhouette_detector.app:main"
had-bot = "silhouette_detector.bot:main"
had-download-minicpm = "silhouette_detector.model_store:main"
had-extract-embeddings = "silhouette_detector.training.extract_embeddings:main"
had-train-transformer = "silhouette_detector.training.train_transformer:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["silhouette_detector*", "SFSORT"]

[tool.setuptools.package-data]
SFSORT = ["LICENSE"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["SFSORT"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/silhouette_detector/app.py" = ["B008", "S104"]
