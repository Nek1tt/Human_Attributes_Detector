name: CI

on:
  push:
    branches:
      - main
      - detector-remaster
  pull_request:
    branches:
      - main
      - detector-remaster
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: uv sync --locked --extra cpu --extra train --extra dev --extra export --extra api

      - name: Install hooks
        run: uv run --no-sync pre-commit install

      - name: Check code and documents
        run: uv run --no-sync pre-commit run --all-files

      - name: Check Python syntax
        run: uv run --no-sync python -m compileall -q src tests scripts

      - name: Run unit tests
        run: uv run --no-sync python -m unittest discover -s tests -v
