name: CI

on:
  push:
    branches:
      - main
      - detector-remaster
  pull_request:
    branches:
      - main
      - detector-remaster
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install dependencies from requirements
        run: python -m pip install -r requirements-cpu.txt

      - name: Check requirements against uv.lock
        run: python scripts/export_requirements.py --check

      - name: Install hooks
        run: pre-commit install

      - name: Check code and documents
        run: pre-commit run --all-files

      - name: Check Python syntax
        run: python -m compileall -q src tests scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
