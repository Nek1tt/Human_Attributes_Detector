name: CI

on:
  push:
    branches:
      - main
      - detector-remaster
  pull_request:
    branches:
      - main
      - detector-remaster
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test tools
        run: pip install -e . ruff

      - name: Run Ruff
        run: ruff check .

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
