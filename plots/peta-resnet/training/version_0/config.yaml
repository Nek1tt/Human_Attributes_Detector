data:
  schema: peta
  root: data/peta
  remote: .dvc-storage
  validation_fraction: 0.2
  test_fraction: 0.2
  seed: 42
  excluded_subsets:
    - i-LID
  image_url: https://mmlab.ie.cuhk.edu.hk/projects/PETA_files/PETA.zip
  image_sha256: 39cab77bee902be06d32d9a09c3e4579295c16cc352790fd718218443b8aacae
preprocess:
  height: 128
  width: 64
  mean:
    - 0.485
    - 0.456
    - 0.406
  std:
    - 0.229
    - 0.224
    - 0.225
  horizontal_flip: 0.5
model:
  label_schema: ${data.schema}
  pretrained: true
  freeze_backbone: true
training:
  epochs: 5
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 2
  threads: 4
  accelerator: gpu
  devices: 1
  seed: 42
  deterministic: true
  gradient_clip_val: 1.0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  output: models/${data.schema}_attributes.pt
logging:
  tracking_uri: http://127.0.0.1:8080
  experiment: human-attributes
  run_name: peta-resnet18
  plots_dir: plots/peta-resnet
inference:
  checkpoint: models/${data.schema}_attributes.pt
  split: test
  image: null
  output: var/predictions.jsonl
  batch_size: 64
  device: cpu
  confidence_threshold: 0.0
  limit: null
production:
  onnx: models/${data.schema}_attributes.onnx
  opset: 17
  mlflow_model: var/serving-model
  triton_repository: var/triton-models
  trt_engine: models/${data.schema}_attributes.engine
  trtexec: trtexec
  max_batch_size: 64
