embeddings:
  root: data/peta_embeddings
  visual_directory: models/original-minicpm-visual
  batch_size: 8
  device: cuda
  reserve_gib: 8
data:
  schema: peta
  root: data/peta
  remote: .dvc-storage
  validation_fraction: 0.2
  test_fraction: 0.2
  seed: 42
  excluded_subsets:
    - i-LID
  image_url: https://mmlab.ie.cuhk.edu.hk/projects/PETA_files/PETA.zip
  image_sha256: 39cab77bee902be06d32d9a09c3e4579295c16cc352790fd718218443b8aacae
preprocess:
  height: 224
  width: 224
  mean:
    - 0.485
    - 0.456
    - 0.406
  std:
    - 0.229
    - 0.224
    - 0.225
  horizontal_flip: 0.5
model:
  architecture: original_resnet50
  output: models/original_resnet_peta.pt
  label_schema: peta_original
  pretrained: true
  initial_weights: models\original_resnet_init.pt
training:
  epochs: 4
  batch_size: 8
  learning_rate: 0.0001
  backbone_learning_rate: 3.0e-06
  weight_decay: 0.1
  num_workers: 2
  threads: 4
  accelerator: gpu
  devices: 1
  seed: 42
  deterministic: true
  precision: bf16-mixed
  gradient_clip_val: 1.0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  output: models/original-resnet-balanced.pt
  initial_checkpoint: null
  monitor: validation_accuracy
  patience: 2
  loss_reduction: sum
  accumulate_grad_batches: 1
  balanced_loss: true
logging:
  tracking_uri: http://127.0.0.1:8080
  experiment: human-attributes
  run_name: original-resnet-balanced
  plots_dir: plots/original-resnet-balanced
inference:
  checkpoint: models/original_resnet_peta.pt
  split: test
  image: null
  output: var/predictions.jsonl
  batch_size: 64
  device: cpu
  confidence_threshold: 0.0
  limit: null
production:
  onnx: models/original_resnet_peta.pt.onnx
  opset: 17
  mlflow_model: var/serving-model
  triton_repository: var/triton-models
  trt_engine: models/original_resnet_peta.pt.engine
  trtexec: trtexec
  max_batch_size: 64
